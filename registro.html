<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>TECNOFIT - Registro</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">

</head>
<body>

    <header>

        <nav class="navbar navbar-dark bg-dark px-4">

            <a href="index.html"
               class="navbar-brand">
               </a>

            <a href="login.html"
               class="btn btn-light">

                INICIAR SESIÓN

            </a>

        </nav>

    </header>

    <main>

        <div class="container py-4">

            <div class="row justify-content-center">

                <div class="col-12 col-md-8 col-lg-6">

                    <div class="card shadow">

                        <div class="card-body">

                            <h1 class="text-center mb-4">

                                Registro de usuario

                            </h1>

                            <form id="registroForm">

                                <div class="mb-3">

                                    <label
                                        for="nombre"
                                        class="form-label">

                                        Nombre Completo

                                    </label>

                                    <input
                                        type="text"
                                        id="nombre"
                                        class="form-control"
                                        maxlength="80">

                                    <div
                                        id="errorNombre"
                                        class="mensaje-error">

                                    </div>

                                </div>

                                <div class="mb-3">

                                    <label
                                        for="correo"
                                        class="form-label">

                                        Correo Electrónico

                                    </label>

                                    <input
                                        type="email"
                                        id="correo"
                                        class="form-control"
                                        maxlength="60"
                                        placeholder="usuario@duoc.cl">

                                    <div
                                        id="errorCorreo"
                                        class="mensaje-error">

                                    </div>

                                </div>

                                <div class="mb-3">

                                    <label
                                        for="password"
                                        class="form-label">

                                        Contraseña

                                    </label>

                                    <input
                                        type="password"
                                        id="password"
                                        class="form-control"
                                        autocomplete="new-password">

                                    <div
                                        id="errorPassword"
                                        class="mensaje-error">

                                    </div>

                                </div>

                                <div class="mb-3">

                                    <label
                                        for="confirmPassword"
                                        class="form-label">

                                        Confirmar Contraseña

                                    </label>

                                    <input
                                        type="password"
                                        id="confirmPassword"
                                        class="form-control"
                                        autocomplete="new-password">

                                    <div
                                        id="errorConfirmPassword"
                                        class="mensaje-error">

                                    </div>

                                </div>

                                <div class="mb-3">

                                    <label
                                        for="telefono"
                                        class="form-label">

                                        Teléfono (opcional)

                                    </label>

                                    <input
                                        type="text"
                                        id="telefono"
                                        class="form-control"
                                        maxlength="9"
                                        placeholder="912345678">

                                    <div
                                        id="errorTelefono"
                                        class="mensaje-error">

                                    </div>

                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-3">

                                    <h2 class="h5 mb-0">

                                        Registro de dispositivos

                                    </h2>

                                    <button
                                        type="button"
                                        id="agregarDispositivo"
                                        class="btn btn-outline-dark btn-sm">

                                        Añadir Dispositivo

                                    </button>

                                </div>


                                <div id="listaDispositivos">

                                    <div class="dispositivo-box border rounded p-3 mb-3">

                                        <div class="mb-3">

                                            <label class="form-label">

                                                Tipo de Dispositivo

                                            </label>

                                            <select
                                                class="form-select tipoDispositivo">

                                                <option value="">

                                                    Seleccione un dispositivo

                                                </option>

                                                <option value="Smartwatch">

                                                    Smartwatch

                                                </option>

                                                <option value="Banda Deportiva">

                                                    Banda Deportiva

                                                </option>

                                                <option value="Ciclocomputador">

                                                    Ciclocomputador

                                                </option>

                                                <option value="Audífonos">

                                                    Audifonos

                                                </option>

                                            </select>

                                        </div>


                                        <div>

                                            <label class="form-label">

                                                Numero de Serie

                                            </label>

                                            <input
                                                type="text"
                                                class="form-control numeroSerie"
                                                maxlength="12">

                                        </div>


                                        <div class="mensaje-error errorDispositivo">

                                        </div>


                                        <button
                                            type="button"
                                            class="btn btn-outline-danger btn-sm mt-3 eliminarDispositivo">

                                            Eliminar

                                        </button>

                                    </div>

                                </div>

                                <div
                                    id="mensajeRegistro"
                                    class="alert d-none">

                                </div>

                                <div class="text-center mt-4">

                                    <button
                                        type="submit"
                                        class="btn btn-dark">

                                        REGISTRAR

                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="registro.js"></script>
</body>

</html>
